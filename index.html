<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Primeval Park">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#141a12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Primeval Park</title>
<style>
:root{
  --jungle:#1c2a1c; --jungle2:#26382a; --jungle3:#33492f; --amber:#e0a43a; --amber2:#f0bf5c; --bone:#efe6d2; --bone2:#cfc4aa;
  --warn:#f2c230; --black:#121410; --red:#c23a24; --muted:#9a9a84; --ok:#8fbf5a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --panel:rgba(20,28,20,.86); --line:rgba(239,230,210,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#141a12;position:fixed;inset:0;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;
  font-family:var(--sans);color:var(--bone)}
img,svg{-webkit-user-drag:none;-webkit-touch-callout:none}
canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#toolbar,#toolbar *,#undoBar,#undoBar *,#dock,#dock *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hidden{display:none !important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.glass{background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.lbl{font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--bone2);opacity:.85}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px);pointer-events:none;z-index:5}
#bar{display:flex;align-items:stretch;gap:8px;pointer-events:auto;border-radius:16px;padding:8px 8px 8px 14px}
#money{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1 1 auto}
#money b{font-family:var(--serif);font-size:24px;line-height:1.05;color:var(--amber2);font-variant-numeric:tabular-nums;letter-spacing:.3px;white-space:nowrap}
#money b.neg{color:#ff8a6a}
#clock{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding-right:4px}
#clock b{font-size:17px;font-variant-numeric:tabular-nums;font-weight:700}
.hb{width:44px;min-height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(239,230,210,.08);border:1px solid var(--line)}
.hb:active{transform:scale(.94)}
#speedBtn{width:52px;flex-direction:column;gap:1px;font-size:10px;font-weight:800;letter-spacing:1px}
#chips{display:flex;gap:6px;margin-top:6px;pointer-events:auto;flex-wrap:nowrap}
.chip{display:flex;align-items:center;gap:5px;padding:6px 9px;border-radius:999px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg.i{width:16px;height:16px}
.chip.bad{color:#ffb39a;border-color:rgba(255,120,90,.45)}
#stars{display:flex;gap:1px}
#stars svg{width:14px;height:14px}
#hatchChip{display:flex;align-items:center;gap:6px}
#hatchChip i{display:block;width:40px;height:4px;border-radius:2px;background:rgba(239,230,210,.18);overflow:hidden}
#hatchChip i u{display:block;height:100%;background:var(--amber)}

/* alert */
#alert{position:absolute;left:calc(var(--sal) + 10px);right:calc(var(--sar) + 10px);top:calc(var(--sat) + 112px);z-index:7;border-radius:14px;overflow:hidden;
  background:#1a1410;border:2px solid var(--warn);box-shadow:0 0 0 1px #000,0 12px 30px rgba(0,0,0,.5);animation:alIn .3s ease}
#alert .stripe{height:10px;background:repeating-linear-gradient(-45deg,var(--warn) 0 12px,#111 12px 24px)}
#alert .body{padding:10px 12px;display:flex;gap:10px;align-items:center}
#alert .txt{flex:1;min-width:0}
#alert .txt b{display:block;color:var(--warn);font-size:13px;letter-spacing:2px;text-transform:uppercase}
#alert .txt span{font-size:14px;line-height:1.3}
@keyframes alIn{0%{transform:translateY(-12px);opacity:0}100%{transform:none;opacity:1}}

/* toasts */
#toasts{position:absolute;left:0;right:0;top:calc(var(--sat) + 112px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:6}
.toast{max-width:min(92%,420px);padding:9px 14px;border-radius:12px;font-size:14px;font-weight:600;line-height:1.3;animation:tIn .25s ease;display:flex;gap:8px;align-items:center}
.toast.good{border-color:rgba(143,191,90,.6)} .toast.bad{border-color:rgba(255,120,90,.7);color:#ffd2c4} .toast.money{border-color:rgba(224,164,58,.7)}
@keyframes tIn{0%{transform:translateY(-8px);opacity:0}100%{transform:none;opacity:1}}
#alert ~ #toasts{top:calc(var(--sat) + 196px)}

/* dock */
#dock{position:absolute;left:calc(var(--sal) + 10px);right:calc(var(--sar) + 10px);bottom:calc(var(--sab) + 10px);display:flex;gap:6px;padding:6px;border-radius:18px;z-index:5}
#dock button{flex:1;min-height:56px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--bone2)}
#dock button svg.i{width:24px;height:24px}
#dock button.on{background:rgba(224,164,58,.16);color:var(--amber2)}
#dock button:active{transform:scale(.95)}

/* sheet (menus + selection) */
#sheet{position:absolute;left:calc(var(--sal) + 10px);right:calc(var(--sar) + 10px);bottom:calc(var(--sab) + 84px);z-index:6;border-radius:18px;max-height:calc(100% - var(--sat) - var(--sab) - 200px);
  display:flex;flex-direction:column;overflow:hidden;animation:shIn .22s ease}
@keyframes shIn{0%{transform:translateY(14px);opacity:0}100%{transform:none;opacity:1}}
#sheet .hd{display:flex;align-items:center;gap:10px;padding:12px 10px 8px 16px}
#sheet .hd h2{margin:0;font-family:var(--serif);font-size:21px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheet .bd{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 14px;touch-action:pan-y}
.tabs{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto;touch-action:pan-x}
.tab{padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700;background:rgba(239,230,210,.07);border:1px solid var(--line);white-space:nowrap;min-height:38px}
.tab.on{background:var(--amber);color:#1b1408;border-color:var(--amber)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{position:relative;text-align:left;border-radius:14px;padding:10px 11px;background:rgba(239,230,210,.06);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-height:92px}
.card:active{transform:scale(.97)}
.card .nm{font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px}
.card .ds{font-size:12px;line-height:1.3;color:var(--bone2);opacity:.9}
.card .pr{font-family:var(--serif);font-size:16px;color:var(--amber2);margin-top:auto}
.card.lock{opacity:.45}
.card .tag{position:absolute;top:8px;right:8px;font-size:10px;font-weight:800;letter-spacing:1px;padding:3px 6px;border-radius:6px;background:rgba(0,0,0,.4)}
.card .tag.red{background:var(--red);color:#fff}
.card img{width:100%;height:78px;object-fit:cover;border-radius:9px;background:#2a3628}
.swatch{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.4)}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row .k{flex:1;font-size:13px;color:var(--bone2)}
.row .v{font-weight:700;font-variant-numeric:tabular-nums}
.meter{height:7px;border-radius:4px;background:rgba(239,230,210,.12);overflow:hidden;flex:0 0 110px}
.meter u{display:block;height:100%;background:var(--ok)}
.meter.warn u{background:var(--warn)} .meter.bad u{background:var(--red)}
.note{font-size:13px;line-height:1.35;padding:9px 11px;border-radius:10px;margin:8px 0;background:rgba(239,230,210,.06);border:1px solid var(--line)}
.note.bad{background:rgba(194,58,36,.16);border-color:rgba(255,120,90,.5);color:#ffd5c8}
.note.warn{background:rgba(242,194,48,.12);border-color:rgba(242,194,48,.5);color:#ffe8a8}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{min-height:46px;padding:0 15px;border-radius:12px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:rgba(239,230,210,.1);border:1px solid var(--line);flex:1 1 auto}
.btn.pri{background:var(--amber);color:#1b1408;border-color:var(--amber)}
.btn.dng{background:#7c1f12;border-color:#c23a24;color:#ffe9e2}
.btn.hz{background:repeating-linear-gradient(-45deg,rgba(242,194,48,.22) 0 10px,rgba(0,0,0,.25) 10px 20px);border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.4}
.btn:active{transform:scale(.97)}
.btn small{font-weight:600;opacity:.8}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:rgba(239,230,210,.05);border:1px solid var(--line);text-align:left;width:100%}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:14px}
.li .t span{font-size:12px;color:var(--bone2)}
.mis{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;background:rgba(239,230,210,.05);border:1px solid var(--line);margin-bottom:6px}
.mis .ck{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--bone2);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.mis.done .ck{background:var(--ok);border-color:var(--ok);color:#142010}
.mis.done{opacity:.6}
.mis b{display:block;font-size:14px} .mis span{font-size:12px;color:var(--bone2)}

/* toolbar during placement */
#toolbar{position:absolute;left:calc(var(--sal) + 10px);right:calc(var(--sar) + 10px);bottom:calc(var(--sab) + 10px);z-index:6;border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px}
#toolbar .top{display:flex;align-items:center;gap:10px}
#toolbar .top .t{flex:1;min-width:0}
#toolbar .top b{display:block;font-size:15px}
#toolbar .top span{font-size:12px;color:var(--bone2)}
#toolbar .cost{font-family:var(--serif);font-size:19px;color:var(--amber2);white-space:nowrap}
#toolbar .cost.bad{color:#ff8a6a}
#toolbar .tiers{display:flex;gap:6px;overflow-x:auto}
#toolbar .tiers .tab{display:flex;align-items:center;gap:6px}
#toolbar .btns .btn{flex:1 1 0;min-width:0;padding:0 10px}
#toolbar .btns .btn svg.i{width:18px;height:18px}
#undoBar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 90px);z-index:7;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:14px;font-size:13px;font-weight:700;max-width:calc(100% - 20px);white-space:nowrap}
#undoBar span{overflow:hidden;text-overflow:ellipsis}
#undoBar .btn{min-height:38px;flex:0 0 auto;padding:0 12px}
#undoBar .btn svg.i{width:16px;height:16px}

/* modal + title + tutorial */
.ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px)}
#modal{background:rgba(8,10,8,.45)}
#modal .box{width:100%;max-width:400px;border-radius:20px;padding:18px 18px 16px;max-height:100%;overflow-y:auto}
#modal h2{margin:0 0 4px;font-family:var(--serif);font-size:24px}
#modal .sub{font-size:13px;color:var(--bone2);margin-bottom:10px}
#title{background:linear-gradient(180deg,rgba(10,14,10,.55) 0%,rgba(10,14,10,.05) 40%,rgba(10,14,10,.2) 60%,rgba(10,14,10,.85) 100%);flex-direction:column;justify-content:space-between}
#title .logo{text-align:center;margin-top:8vh}
#title .logo .k{font-size:11px;letter-spacing:5px;font-weight:700;color:var(--bone2)}
#title .logo h1{margin:6px 0 0;font-family:var(--serif);font-weight:900;font-size:50px;line-height:.95;letter-spacing:2px;color:var(--amber2);text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 30px rgba(0,0,0,.4)}
#title .logo .rule{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:10px;color:var(--bone);font-size:12px;letter-spacing:4px;font-weight:700}
#title .logo .rule i{display:block;width:40px;height:1px;background:var(--bone2)}
#title .acts{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;margin-bottom:4vh}
#title .acts .btn{min-height:54px;font-size:16px}
#title .foot{font-size:11px;color:var(--bone2);text-align:center;opacity:.75;margin-top:4px}
#tut{background:rgba(8,10,8,.25);align-items:flex-end;padding-bottom:calc(var(--sab) + 96px)}
#tut .box{width:100%;max-width:420px;border-radius:20px;padding:16px 16px 14px}
#tut .step{font-size:11px;letter-spacing:2px;font-weight:800;color:var(--amber2)}
#tut h3{margin:4px 0 6px;font-family:var(--serif);font-size:22px}
#tut p{margin:0;font-size:14px;line-height:1.45;color:var(--bone)}
#tut .btns{margin-top:14px}
#flash{position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,rgba(150,0,0,0) 40%,rgba(150,10,0,.55) 100%);opacity:0;transition:opacity .5s}
#flash.on{opacity:1;transition:opacity .08s}
#loading{position:absolute;inset:0;z-index:30;background:#141a12;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:12px;letter-spacing:3px;color:var(--bone2)}
#loading i{display:block;width:140px;height:3px;background:rgba(239,230,210,.15);border-radius:2px;overflow:hidden}
#loading i u{display:block;height:100%;width:30%;background:var(--amber);animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
.pricectl{display:flex;align-items:center;gap:8px}
.pricectl .btn{flex:0 0 46px;padding:0}
.pricectl b{font-family:var(--serif);font-size:22px;color:var(--amber2);min-width:64px;text-align:center}

/* landscape: dock becomes a left rail, sheets sit beside it */
@media (orientation:landscape) and (max-height:560px){
  #dock{left:calc(var(--sal) + 8px);right:auto;top:calc(var(--sat) + 8px);bottom:calc(var(--sab) + 8px);flex-direction:column;width:72px;padding:5px}
  #dock button{min-height:0}
  #hud{left:calc(var(--sal) + 86px);padding-left:0;padding-top:calc(var(--sat) + 8px)}
  #bar{max-width:560px}
  #chips{max-width:560px}
  #sheet{left:calc(var(--sal) + 90px);right:auto;width:min(440px,calc(100% - var(--sal) - 110px));bottom:calc(var(--sab) + 8px);max-height:calc(100% - var(--sat) - var(--sab) - 110px)}
  #toolbar{left:calc(var(--sal) + 90px);right:auto;width:min(460px,calc(100% - var(--sal) - 110px));bottom:calc(var(--sab) + 8px)}
  #alert{left:auto;right:calc(var(--sar) + 10px);top:calc(var(--sat) + 8px);width:min(380px,40%)}
  #toasts{left:calc(var(--sal) + 86px);top:calc(var(--sat) + 104px)}
  #title .logo{margin-top:2vh} #title .logo h1{font-size:40px}
  #tut{padding-bottom:calc(var(--sab) + 14px);justify-content:flex-end}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="flash"></div>
<div id="hud" class="hidden">
  <div id="bar" class="glass">
    <div id="money"><span class="lbl">Funds</span><b id="moneyV">$0</b></div>
    <div id="clock"><span class="lbl" id="dayV">Day 1</span><b id="timeV">08:00</b></div>
    <button class="hb" id="speedBtn" aria-label="Speed"></button>
    <button class="hb" id="soundBtn" aria-label="Sound"></button>
  </div>
  <div id="chips">
    <span class="chip glass" id="cGuests"></span>
    <span class="chip glass" id="cStars"></span>
    <span class="chip glass" id="cSafety"></span>
    <span class="chip glass hidden" id="hatchChip"></span>
  </div>
</div>
<div id="alert" class="hidden"></div>
<div id="toasts"></div>
<nav id="dock" class="glass hidden"></nav>
<div id="sheet" class="glass hidden"></div>
<div id="toolbar" class="glass hidden"></div>
<div id="undoBar" class="glass hidden"></div>
<div id="title" class="ov hidden"></div>
<div id="tut" class="ov hidden"></div>
<div id="modal" class="ov hidden"></div>
<div id="loading"><div>LOADING ISLAND</div><i><u></u></i></div>
<script type="module" src="game.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
</script>
</body>
</html>
